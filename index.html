<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>">
<meta name="application-name" content="Order Status">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Order Status Companion</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Fira+Code:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --void:    #07080d;
  --deep:    #0d0f18;
  --surface: #111420;
  --raised:  #171b2a;
  --rim:     #1e2438;
  --rim2:    #252d42;
  --accent:  #4f7cff;
  --accent2: #7c5cfc;
  --teal:    #00e5cc;
  --green:   #00e676;
  --red:     #ff4d6d;
  --amber:   #ffb300;
  --text:    #e8ecff;
  --text2:   #8891b0;
  --text3:   #3d4560;
  --f:       'Outfit', sans-serif;
  --m:       'Fira Code', monospace;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--void);
  color: var(--text);
  font-family: var(--f);
  min-height: 100vh;
  display: flex; flex-direction: column; align-items: center;
  padding-bottom: 60px;
}

body::before {
  content: '';
  position: fixed; inset: 0; z-index: 0;
  background:
    radial-gradient(ellipse 70% 50% at 15% 20%, rgba(79,124,255,0.06) 0%, transparent 60%),
    radial-gradient(ellipse 50% 40% at 85% 80%, rgba(124,92,252,0.05) 0%, transparent 60%);
  pointer-events: none;
}

/* ── TOPBAR ── */
.topbar {
  position: sticky; top: 0; z-index: 100;
  width: 100%;
  background: rgba(7,8,13,0.94);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--rim);
  display: flex; align-items: center;
  padding: 0 24px; height: 56px; gap: 14px;
}

.brand {
  display: flex; align-items: center; gap: 9px;
}

.brand-mark {
  width: 30px; height: 30px;
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px;
}

.brand-name {
  font-size: 14px; font-weight: 700;
  letter-spacing: 0.3px;
}

.topbar-right {
  margin-left: auto;
  display: flex; align-items: center; gap: 10px;
}

.session-pill {
  display: flex; align-items: center; gap: 7px;
  background: var(--raised);
  border: 1px solid var(--rim);
  border-radius: 20px;
  padding: 5px 12px;
  font-family: var(--m);
  font-size: 9px;
  color: var(--text3);
  transition: all 0.3s;
}

.session-pill.live {
  border-color: rgba(0,230,118,0.3);
  background: rgba(0,230,118,0.05);
  color: var(--green);
}

.s-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--text3); transition: all 0.3s;
}

.s-dot.live {
  background: var(--green);
  box-shadow: 0 0 6px var(--green);
  animation: blink 2s infinite;
}

@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.4} }

.btn-cfg {
  background: transparent;
  border: 1px solid var(--rim);
  color: var(--text3);
  border-radius: 7px;
  font-family: var(--m);
  font-size: 9px; padding: 5px 10px;
  cursor: pointer; transition: all 0.15s;
}
.btn-cfg:hover { color: var(--text2); border-color: var(--rim2); }

/* ── MAIN ── */
main {
  position: relative; z-index: 1;
  width: 100%; max-width: 860px;
  padding: 24px 16px 0;
  display: flex; flex-direction: column; gap: 14px;
}

/* ── LOCK SCREEN ── */
.lock-screen {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; text-align: center;
  padding: 80px 20px;
  gap: 24px;
  animation: fadeIn 0.4s ease;
}

@keyframes fadeIn { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }

.lock-icon {
  width: 80px; height: 80px;
  background: var(--surface);
  border: 1px solid var(--rim);
  border-radius: 22px;
  display: flex; align-items: center; justify-content: center;
  font-size: 32px;
  position: relative;
}

.lock-icon::after {
  content: '';
  position: absolute; inset: -1px;
  border-radius: 22px;
  background: linear-gradient(135deg, rgba(79,124,255,0.15), rgba(124,92,252,0.15));
  z-index: -1;
}

.lock-title {
  font-size: 22px; font-weight: 700;
  color: var(--text);
}

.lock-sub {
  font-family: var(--m);
  font-size: 11px; color: var(--text3);
  max-width: 300px; line-height: 1.7;
}

.polling-status {
  display: flex; align-items: center; gap: 8px;
  font-family: var(--m); font-size: 10px; color: var(--text3);
}

.poll-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--text3);
}

.poll-dot.checking {
  background: var(--teal);
  animation: blink 1s infinite;
}

/* ── CONFIG PANEL ── */
.config-panel {
  background: var(--surface);
  border: 1px solid var(--rim);
  border-radius: 14px;
  overflow: hidden;
  display: none;
}

.config-panel.on { display: block; }

.cfg-hdr {
  padding: 14px 18px;
  background: var(--raised);
  border-bottom: 1px solid var(--rim);
  display: flex; align-items: center; justify-content: space-between;
}

.cfg-title {
  font-family: var(--m);
  font-size: 10px; color: var(--text2);
  letter-spacing: 1px; text-transform: uppercase;
}

.cfg-body {
  padding: 18px;
  display: flex; flex-direction: column; gap: 12px;
}

.cfg-field { display: flex; flex-direction: column; gap: 5px; }

.cfg-lbl {
  font-family: var(--m);
  font-size: 9px; color: var(--accent);
  letter-spacing: 1.5px; text-transform: uppercase;
}

.cfg-inp {
  background: var(--raised);
  border: 1px solid var(--rim2);
  border-radius: 8px;
  color: var(--text);
  font-family: var(--m);
  font-size: 11px; padding: 9px 12px;
  outline: none; transition: border-color 0.15s; width: 100%;
}
.cfg-inp:focus { border-color: var(--accent); }
.cfg-inp::placeholder { color: var(--text3); }

.btn-save {
  background: var(--raised);
  border: 1px solid var(--rim2);
  color: var(--text2); border-radius: 8px;
  font-family: var(--m); font-size: 10px;
  padding: 9px 18px; cursor: pointer;
  transition: all 0.15s; width: 100%;
}
.btn-save:hover { border-color: var(--accent); color: var(--text); }

/* ── SEARCH ── */
.search-section {
  background: var(--surface);
  border: 1px solid var(--rim);
  border-radius: 14px; padding: 20px;
  display: none;
}

.search-section.on { display: block; }

.search-eyebrow {
  font-family: var(--m);
  font-size: 9px; color: var(--accent);
  letter-spacing: 2px; text-transform: uppercase;
  margin-bottom: 14px;
}

.search-row { display: flex; gap: 8px; }

.search-inp {
  flex: 1;
  background: var(--raised);
  border: 1px solid var(--rim2);
  border-radius: 9px;
  color: var(--text);
  font-family: var(--m);
  font-size: 18px; font-weight: 300;
  padding: 12px 16px; outline: none;
  transition: border-color 0.15s;
  letter-spacing: 1.5px;
}
.search-inp:focus { border-color: var(--accent); }
.search-inp::placeholder { color: var(--text3); font-size: 13px; letter-spacing: 0.5px; }

.btn-go {
  background: var(--accent);
  color: #fff; border: none; border-radius: 9px;
  font-family: var(--m); font-size: 10px; font-weight: 500;
  padding: 12px 22px; cursor: pointer;
  letter-spacing: 1px; text-transform: uppercase; transition: all 0.15s;
}
.btn-go:hover { background: #6b91ff; transform: translateY(-1px); }

.search-hint {
  font-family: var(--m); font-size: 10px; color: var(--text3);
  min-height: 16px; padding: 6px 2px 0;
}
.search-hint.ok   { color: var(--green); }
.search-hint.warn { color: var(--amber); }

/* ── RECORD CARD ── */
.result-wrap {
  display: none; flex-direction: column; gap: 12px;
}
.result-wrap.on { display: flex; animation: fadeIn 0.2s ease; }

.customer-card {
  background: var(--surface);
  border: 1px solid var(--rim);
  border-radius: 14px;
  padding: 18px 22px;
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  position: relative; overflow: hidden;
}
.customer-card::before {
  content: '';
  position: absolute; top: 0; left: 0; bottom: 0; width: 3px;
  background: linear-gradient(180deg, var(--accent), var(--teal));
}

.c-av {
  width: 46px; height: 46px;
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
  border-radius: 13px;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--m); font-size: 15px; font-weight: 600; color: #fff;
  flex-shrink: 0;
  box-shadow: 0 4px 16px rgba(79,124,255,0.25);
}

.c-info { flex: 1; min-width: 0; }
.c-name { font-size: 19px; font-weight: 700; color: var(--text); }
.c-biz  { font-size: 12px; color: var(--teal); margin-top: 3px; }

.c-fields {
  display: flex; gap: 18px; margin-top: 10px; flex-wrap: wrap;
}

.cf { display: flex; flex-direction: column; gap: 3px; }
.cf-lbl { font-family: var(--m); font-size: 8px; color: var(--accent); letter-spacing: 1.5px; text-transform: uppercase; }
.cf-val { font-family: var(--m); font-size: 11px; color: var(--text2); }

.panels { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; }

.panel {
  background: var(--surface);
  border: 1px solid var(--rim);
  border-radius: 12px; overflow: hidden;
  transition: border-color 0.2s;
}
.panel.dim { opacity: 0.22; }

.ph { padding: 10px 16px; border-bottom: 1px solid var(--rim); display: flex; align-items: center; gap: 8px; }
.ph-icon { font-size: 14px; }
.ph-title { font-family: var(--m); font-size: 9px; font-weight: 500; letter-spacing: 1px; text-transform: uppercase; }
.ph-badge { margin-left: auto; font-family: var(--m); font-size: 9px; padding: 2px 7px; border-radius: 20px; }

.pw .ph { background: rgba(79,124,255,0.07); } .pw .ph-title { color: var(--accent); }
.pw .ph-badge { color: var(--accent); background: rgba(79,124,255,0.1); border: 1px solid rgba(79,124,255,0.2); }
.pi .ph { background: rgba(0,230,118,0.07); } .pi .ph-title { color: var(--green); }
.pi .ph-badge { color: var(--green); background: rgba(0,230,118,0.1); border: 1px solid rgba(0,230,118,0.2); }
.pv .ph { background: rgba(124,92,252,0.07); } .pv .ph-title { color: var(--accent2); }
.pv .ph-badge { color: var(--accent2); background: rgba(124,92,252,0.1); border: 1px solid rgba(124,92,252,0.2); }

.pb { padding: 12px 16px; display: flex; flex-direction: column; gap: 9px; }
.pf { display: flex; flex-direction: column; gap: 3px; }
.pf-l { font-family: var(--m); font-size: 8px; color: var(--text3); letter-spacing: 1.2px; text-transform: uppercase; }
.pf-v { font-size: 12px; font-weight: 500; color: var(--text); }
.pf-v.mono { font-family: var(--m); font-size: 11px; }
.pf-v.dim  { color: var(--text3); font-style: italic; font-size: 11px; }
.pfr { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

.spill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 4px; font-family: var(--m); font-size: 10px; font-weight: 500; }
.spill::before { content:''; width:5px; height:5px; border-radius:50%; flex-shrink:0; }
.sa { background: rgba(0,230,118,0.1);  color:var(--green);   border:1px solid rgba(0,230,118,0.2);  } .sa::before  { background:var(--green); }
.ss { background: rgba(79,124,255,0.1); color:var(--accent);  border:1px solid rgba(79,124,255,0.2); } .ss::before  { background:var(--accent); }
.sc { background: rgba(255,77,109,0.1); color:var(--red);     border:1px solid rgba(255,77,109,0.2); } .sc::before  { background:var(--red); }
.sp { background: rgba(255,179,0,0.1);  color:var(--amber);   border:1px solid rgba(255,179,0,0.2);  } .sp::before  { background:var(--amber); }
.so { background: rgba(124,92,252,0.1); color:var(--accent2); border:1px solid rgba(124,92,252,0.2); } .so::before  { background:var(--accent2); }

.lp-row { display: flex; flex-wrap: wrap; gap: 5px; }
.lp { background: var(--raised); border: 1px solid var(--rim); border-radius: 7px; padding: 5px 8px; display: flex; flex-direction: column; align-items: center; min-width: 38px; }
.lp-n { font-family: var(--m); font-size: 14px; font-weight: 600; color: var(--text); line-height: 1; }
.lp-l { font-family: var(--m); font-size: 7px; color: var(--text3); text-transform: uppercase; margin-top: 2px; }

.details-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.det { background: var(--surface); border: 1px solid var(--rim); border-radius: 11px; padding: 13px 16px; }
.det-lbl { font-family: var(--m); font-size: 8px; color: var(--text3); letter-spacing: 1.2px; text-transform: uppercase; margin-bottom: 7px; }
.det-val { font-size: 13px; color: var(--text); line-height: 1.6; }

.ol-wrap { background: var(--surface); border: 1px solid var(--rim); border-radius: 12px; overflow: hidden; display: none; }
.ol-hdr  { padding: 11px 18px; background: var(--raised); border-bottom: 1px solid var(--rim); font-family: var(--m); font-size: 9px; color: var(--accent); letter-spacing: 2px; text-transform: uppercase; }
.ol-body { padding: 14px 18px; display: flex; flex-direction: column; gap: 10px; }
.ol-line { background: var(--raised); border: 1px solid var(--rim); border-radius: 9px; padding: 12px 14px; }
.ol-top  { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; flex-wrap: wrap; }
.ol-dev  { font-size: 13px; font-weight: 500; color: var(--text); }
.ol-badge{ margin-left: auto; font-family: var(--m); font-size: 9px; padding: 2px 8px; border-radius: 4px; }
.ol-fields { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
.olf { display: flex; flex-direction: column; gap: 2px; }
.olf-l { font-family: var(--m); font-size: 7px; color: var(--text3); letter-spacing: 1px; text-transform: uppercase; }
.olf-v { font-family: var(--m); font-size: 11px; color: var(--text2); }

.no-result { text-align: center; padding: 36px; font-family: var(--m); font-size: 11px; color: var(--text3); background: var(--surface); border: 1px solid var(--rim); border-radius: 12px; }

footer {
  position: relative; z-index: 1;
  margin-top: 48px;
  font-family: var(--m); font-size: 9px; color: var(--text3);
  text-align: center; letter-spacing: 0.5px;
}

@media(max-width:680px){
  .topbar{padding:0 14px;}
  main{padding:14px 12px 0;}
  .panels{grid-template-columns:1fr;}
  .details-row{grid-template-columns:1fr;}
  .ol-fields{grid-template-columns:1fr 1fr;}
  .search-inp{font-size:16px;}
}
@media(max-width:860px) and (min-width:681px){
  .panels{grid-template-columns:1fr 1fr;}
  .details-row{grid-template-columns:1fr 1fr;}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="brand-mark">📋</div>
    <span class="brand-name">Order Status</span>
  </div>
  <div class="topbar-right">
    <div class="session-pill" id="sessionPill">
      <div class="s-dot" id="sDot"></div>
      <span id="sLabel">Checking…</span>
    </div>
    <button class="btn-cfg" onclick="toggleConfig()">⚙ Config</button>
  </div>
</div>

<main>

  <!-- CONFIG PANEL -->
  <div class="config-panel" id="configPanel">
    <div class="cfg-hdr">
      <span class="cfg-title">Session Configuration</span>
      <button class="btn-cfg" onclick="toggleConfig()">✕</button>
    </div>
    <div class="cfg-body">
      <div class="cfg-field">
        <label class="cfg-lbl">Gist ID</label>
        <input type="text" class="cfg-inp" id="cfgGistId" placeholder="Paste the Gist ID from the Vault"/>
        <span style="font-family:var(--m);font-size:9px;color:var(--text3);margin-top:3px">Provided by whoever manages the Vault</span>
      </div>
      <button class="btn-save" onclick="saveCompCfg()">Save & Connect</button>
    </div>
  </div>

  <!-- LOCK SCREEN -->
  <div class="lock-screen" id="lockScreen">
    <div class="lock-icon">🔒</div>
    <div class="lock-title">Session Required</div>
    <div class="lock-sub">Waiting for the Vault to activate a session. This app will unlock automatically when a session is live.</div>
    <div class="polling-status">
      <div class="poll-dot" id="pollDot"></div>
      <span id="pollStatus">Configure Gist ID to begin polling</span>
    </div>
    <button onclick="pollOnce()" style="background:transparent;border:1px solid var(--rim2);color:var(--text3);border-radius:7px;font-family:var(--m);font-size:10px;padding:7px 16px;cursor:pointer;margin-top:4px;">
      🔄 Check Now
    </button>
  </div>

  <!-- SEARCH (shown when session active) -->
  <div class="search-section" id="searchSection">
    <div class="search-eyebrow">Search by phone number</div>
    <div class="search-row">
      <input type="text" class="search-inp" id="phoneInp"
             placeholder="(555) 867-5309  or  5558675309"
             autocomplete="off" oninput="onPhone()"/>
      <button class="btn-go" onclick="doSearch()">Search</button>
    </div>
    <div class="search-hint" id="searchHint"></div>
  </div>

  <!-- RESULT -->
  <div class="result-wrap" id="resultWrap">
    <div id="resultInner"></div>
  </div>

</main>

<footer id="footerText"></footer>

<script>
// ── CONFIG ────────────────────────────────────────────────────────────────
const CPFX = 'comp_cfg_';
// AES-GCM key — MUST match the key in the Vault app exactly
// This is hardcoded into the companion — never changes
const ENC_KEY_B64 = 'lVcBT1TiQwC6Reti9Gu2+oQ9xEUFwyTnQ23ItYePcm0=';

let reportData  = null;  // decrypted in-memory only
let byPhone     = {};
let bySPM       = {};
let olByPhone   = {};
let olBySPM     = {};
let sessionLive = false;
let pollTimer   = null;

const strip = s => { const d=String(s??'').replace(/\D/g,''); return d.length>=10?d.slice(-10):d; };

function loadCompCfg() {
  try {
    const saved = localStorage.getItem(CPFX+'gistId') || '';
    document.getElementById('cfgGistId').value = saved;
  } catch(e) {
    console.error('loadCompCfg error:', e);
  }
}

function saveCompCfg() {
  try {
    const val = document.getElementById('cfgGistId').value.trim();
    if (!val) {
      alert('Please enter a Gist ID');
      return;
    }
    localStorage.setItem(CPFX+'gistId', val);
    document.getElementById('pollStatus').textContent = 'Gist ID saved — connecting…';
    toggleConfig();
    startPolling();
  } catch(e) {
    alert('Save error: ' + e.message);
  }
}

function toggleConfig() {
  const p = document.getElementById('configPanel');
  p.classList.toggle('on');
}

// ── POLLING ───────────────────────────────────────────────────────────────
function startPolling() {
  const gistId = localStorage.getItem(CPFX+'gistId');
  if (!gistId) {
    document.getElementById('pollStatus').textContent = 'No Gist ID — tap ⚙ Config';
    return;
  }
  pollOnce();
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(pollOnce, 30000);
}

async function pollOnce() {
  const gistId = localStorage.getItem(CPFX+'gistId');
  if (!gistId) {
    document.getElementById('pollStatus').textContent = 'No Gist ID — tap ⚙ Config';
    return;
  }

  const dot = document.getElementById('pollDot');
  dot.classList.add('checking');
  document.getElementById('pollStatus').textContent = 'Checking session…';

  try {
    const gistId = localStorage.getItem(CPFX+'gistId');
    if (!gistId) throw new Error('No Gist ID configured');

    // Use GitHub API to read public Gist — works from any origin without auth
    const url = `https://api.github.com/gists/${gistId}`;

    const controller = new AbortController();
    const timeout    = setTimeout(() => controller.abort(), 10000);

    let res;
    try {
      res = await fetch(url, {
        cache:   'no-store',
        signal:  controller.signal,
        headers: { 'Accept': 'application/vnd.github.v3+json' }
      });
    } catch(fetchErr) {
      clearTimeout(timeout);
      if (fetchErr.name === 'AbortError') throw new Error('Timed out — check Gist ID');
      throw new Error('Fetch failed: ' + fetchErr.message);
    }
    clearTimeout(timeout);

    if (res.status === 404) throw new Error('Gist not found — check Gist ID');
    if (res.status === 403) throw new Error('Gist is private — make it public on gist.github.com');
    if (!res.ok) throw new Error(`GitHub API error (${res.status})`);

    const gistData = await res.json();

    // Extract session.json content from the Gist files
    const sessionFile = gistData.files && gistData.files['session.json'];
    if (!sessionFile) throw new Error('session.json not found in Gist — activate from Vault first');

    // Get the raw content — either inline or fetch from raw_url
    let sessionText = sessionFile.content;
    if (!sessionText && sessionFile.raw_url) {
      const rawRes = await fetch(sessionFile.raw_url, { cache: 'no-store' });
      sessionText  = await rawRes.text();
    }

    let json;
    try { json = JSON.parse(sessionText); }
    catch { throw new Error('Invalid session data — activate from Vault first'); }

    const metaStr = JSON.stringify({ active: json.active, expires: json.expires });
    const dataB64 = json.data || '';
    const meta    = { active: json.active, expires: json.expires };

    if (!json.active || Date.now() > json.expires) {
      // Session not active or expired
      if (sessionLive) {
        // Was live, now killed — wipe memory immediately
        wipeSession();
      }
      setPillState(false, 'No Session');
      dot.classList.remove('checking');
      document.getElementById('pollStatus').textContent = `Last checked ${new Date().toLocaleTimeString()}`;
      return;
    }

    // Session is active — decrypt data if not already loaded
    if (!sessionLive && dataB64) {
      const plaintext = await decryptData(dataB64);
      reportData = JSON.parse(plaintext);
      buildIndexes();
      sessionLive = true;
      setPillState(true, 'Session Live');
      showSearchUI(reportData);
    } else if (sessionLive) {
      // Already live — just update timer display
      const remaining = meta.expires - Date.now();
      const h = Math.floor(remaining/3600000);
      const m = Math.floor((remaining%3600000)/60000);
      setPillState(true, `Live · ${h}h ${m}m`);
    }

    dot.classList.remove('checking');
    document.getElementById('pollStatus').textContent = `Active · next check in 30s`;

  } catch(err) {
    dot.classList.remove('checking');
    const msg = err.message || String(err);
    document.getElementById('pollStatus').textContent = `Error: ${msg}`;
    // Show on lock screen too so it's visible
    document.getElementById('lockScreen').querySelector('.lock-sub').textContent =
      `Connection error: ${msg}`;
    console.error('pollOnce error:', err);
  }
}

function wipeSession() {
  reportData  = null;
  byPhone     = {};
  bySPM       = {};
  olByPhone   = {};
  olBySPM     = {};
  sessionLive = false;
  document.getElementById('searchSection').classList.remove('on');
  document.getElementById('resultWrap').classList.remove('on');
  document.getElementById('resultInner').innerHTML = '';
  document.getElementById('lockScreen').style.display = '';
  document.getElementById('footerText').textContent = '';
  document.getElementById('phoneInp').value = '';
  document.getElementById('searchHint').textContent = '';
}

function showSearchUI(data) {
  document.getElementById('lockScreen').style.display = 'none';
  document.getElementById('searchSection').classList.add('on');
  const loc   = data.location || '';
  const range = data.date_range || '';
  document.getElementById('footerText').textContent = `${loc} · ${range} · Session active`;
}

function setPillState(live, label) {
  const pill = document.getElementById('sessionPill');
  const dot  = document.getElementById('sDot');
  const lbl  = document.getElementById('sLabel');
  if (live) {
    pill.classList.add('live');
    dot.classList.add('live');
  } else {
    pill.classList.remove('live');
    dot.classList.remove('live');
  }
  lbl.textContent = label;
}

function buildIndexes() {
  if (!reportData) return;
  byPhone = {}; bySPM = {}; olByPhone = {}; olBySPM = {};
  reportData.sh.forEach((r,i) => {
    const ph  = strip(r['Phone']||'');
    const oid = (r['Order ID']||'').trim();
    if (ph.length===10) { if(!byPhone[ph]) byPhone[ph]=[]; byPhone[ph].push(i); }
    if (oid)            { if(!bySPM[oid])  bySPM[oid] =[]; bySPM[oid].push(i); }
  });
  reportData.ol.forEach((r,i) => {
    const tn  = strip(r['spe.TN']||'');
    const spm = (r['sp.SPM Number']||'').trim();
    if (tn.length===10) { if(!olByPhone[tn]) olByPhone[tn]=[]; olByPhone[tn].push(i); }
    if (spm)            { if(!olBySPM[spm])  olBySPM[spm] =[]; olBySPM[spm].push(i); }
  });
}

// ── DECRYPTION ────────────────────────────────────────────────────────────
async function getKey() {
  const raw = Uint8Array.from(atob(ENC_KEY_B64), c=>c.charCodeAt(0));
  return crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['encrypt','decrypt']);
}

async function decryptData(b64) {
  const key      = await getKey();
  const combined = Uint8Array.from(atob(b64), c=>c.charCodeAt(0));
  const iv       = combined.slice(0,12);
  const ct       = combined.slice(12);
  const pt       = await crypto.subtle.decrypt({name:'AES-GCM',iv}, key, ct);
  return new TextDecoder().decode(pt);
}

// ── SEARCH ────────────────────────────────────────────────────────────────
document.getElementById('phoneInp').addEventListener('keydown', e => { if(e.key==='Enter') doSearch(); });

function onPhone() {
  const raw = document.getElementById('phoneInp').value.replace(/\D/g,'');
  const h   = document.getElementById('searchHint');
  if (!raw) { h.textContent=''; h.className='search-hint'; return; }
  if (raw.length<10) { h.textContent=`${raw.length} of 10 digits`; h.className='search-hint warn'; }
  else { const d=raw.slice(-10); h.textContent=`Searching: ${d.slice(0,3)}-${d.slice(3,6)}-${d.slice(6)}`; h.className='search-hint ok'; }
}

let currentPhone = '';

function doSearch() {
  if (!sessionLive || !reportData) return;
  const q = strip(document.getElementById('phoneInp').value);
  if (!q || q.length<10) return;
  currentPhone = q;

  // Primary: SH phone match
  let shIdxs = byPhone[q] || [];

  // Fallback: OL spe.TN → SPM → SH
  if (!shIdxs.length && olByPhone[q]) {
    const spms = new Set(olByPhone[q].map(i=>(reportData.ol[i]['sp.SPM Number']||'').trim()));
    reportData.sh.forEach((r,i)=>{ if(spms.has((r['Order ID']||'').trim())) shIdxs.push(i); });
  }

  const inner = document.getElementById('resultInner');
  const wrap  = document.getElementById('resultWrap');

  if (!shIdxs.length) {
    inner.innerHTML = '<div class="no-result">No record found for that number</div>';
    wrap.classList.add('on');
    return;
  }

  renderRecord(reportData.sh[shIdxs[0]], q);
  wrap.classList.add('on');
}

    const pt=(r2['Product Type (Broken Out)']||'').toUpperCase();
    const pk=(r2['Package']||'').toUpperCase();
    return pt==='AIR/AWB'||pt==='NEW INTERNET'||pk.includes('INTERNET AIR')||pk.includes('AT&T INTERNET');
  });

  const wSt=g('Wireless Status'), wPr=g('Wireless Provider');
  const iPr=g('Internet Provider'), iSt=g('Internet Status');
  const vPr=g('Video Provider'), vSt=g('Video Status');

  const linePills = [[g('Wireless Line Count'),'Total'],[g('New Line Count'),'New'],[g('Port Line Count'),'Port'],[g('Upgrade Line Count'),'Upg'],[g('BYOD Line Count'),'BYOD'],[g('Hotspot Count'),'Hotspot']]
    .filter(([n])=>parseFloat(n)>0)
    .map(([n,l])=>`<div class="lp"><div class="lp-n">${n}</div><div class="lp-l">${l}</div></div>`)
    .join('') || '—';

  const inetBest = airRows[0];
  const inetPkg  = inetBest ? inetBest['Package'] : g('Internet Package');
  const inetSt   = inetBest ? inetBest['DTR Status (enriched)'] : iSt;
  const inetBan  = inetBest ? inetBest['spe.Account BAN'] : g('Internet Acct #');

  // OL per-line section
  const olIdxs = (oid&&olBySPM[oid]) ? olBySPM[oid] : (phone&&olByPhone[phone]) ? olByPhone[phone] : [];
  const olHTML = olIdxs.length ? renderOLLines(olIdxs) : '';

  const apt = g('Apt #');

  document.getElementById('resultInner').innerHTML = `
    <div class="customer-card">
      <div class="c-av">${name.split(' ').filter(Boolean).slice(0,2).map(p=>p[0]).join('').toUpperCase()||'?'}</div>
      <div class="c-info">
        <div class="c-name">${name||'—'}</div>
        <div class="c-biz">${g('Business Name')?`${g('Business Name')}${g('Business Type')?' · '+g('Business Type').toUpperCase():''}`:g('Campaign').slice(0,44)||''}</div>
        <div class="c-fields">
          <div class="cf"><div class="cf-lbl">Order ID</div><div class="cf-val">${oid||'—'}</div></div>
          <div class="cf"><div class="cf-lbl">Sales Rep</div><div class="cf-val">${g('Salesperson')||'—'}</div></div>
          <div class="cf"><div class="cf-lbl">Order Date</div><div class="cf-val">${g('Order Date')||'—'}</div></div>
          <div class="cf"><div class="cf-lbl">Order Type</div><div class="cf-val">${g('Order Type')||'—'}</div></div>
        </div>
      </div>
    </div>

    <div class="panels">
      <div class="panel pw${!wSt&&!wPr?' dim':''}">
        <div class="ph"><span class="ph-icon">📱</span><span class="ph-title">Wireless</span><span class="ph-badge">${wSt||wPr?'Found':'Not Found'}</span></div>
        <div class="pb">
          <div class="pf"><div class="pf-l">Status</div><div class="pf-v">${spill(wSt)}</div></div>
          <div class="pf"><div class="pf-l">Account #</div><div class="pf-v mono">${g('Wireless Acct #')||'—'}</div></div>
          <div class="pf"><div class="pf-l">Lines</div><div class="lp-row">${linePills}</div></div>
          <div class="pfr">
            <div class="pf"><div class="pf-l">Active</div><div class="pf-v mono dim">${g('Wireless Active Date')||'—'}</div></div>
            <div class="pf"><div class="pf-l">Cancel</div><div class="pf-v mono dim">${g('Wireless Cancel Date')||'—'}</div></div>
          </div>
        </div>
      </div>

      <div class="panel pi${!iPr&&!iSt&&!airRows.length?' dim':''}">
        <div class="ph"><span class="ph-icon">🌐</span><span class="ph-title">Internet</span><span class="ph-badge">${iPr||iSt||airRows.length?airRows.length>1?`${airRows.length} lines`:'Found':'Not Found'}</span></div>
        <div class="pb">
          <div class="pf"><div class="pf-l">Provider</div><div class="pf-v">${airRows.length?'AT&T':(iPr||'—')}</div></div>
          <div class="pf"><div class="pf-l">Package</div><div class="pf-v">${inetPkg||'—'}</div></div>
          <div class="pf"><div class="pf-l">Status</div><div class="pf-v">${spill(inetSt)}</div></div>
          <div class="pf"><div class="pf-l">Account #</div><div class="pf-v mono dim">${inetBan||'—'}</div></div>
        </div>
      </div>

      <div class="panel pv${!vPr&&!vSt?' dim':''}">
        <div class="ph"><span class="ph-icon">📺</span><span class="ph-title">Video</span><span class="ph-badge">${vPr||vSt?'Found':'Not Found'}</span></div>
        <div class="pb">
          <div class="pf"><div class="pf-l">Provider</div><div class="pf-v">${vPr||'—'}</div></div>
          <div class="pf"><div class="pf-l">Package</div><div class="pf-v">${g('Video Package')||'—'}</div></div>
          <div class="pf"><div class="pf-l">Status</div><div class="pf-v">${spill(vSt)}</div></div>
          <div class="pf"><div class="pf-l">Account #</div><div class="pf-v mono dim">${g('Video Acct #')||'—'}</div></div>
        </div>
      </div>
    </div>

    <div class="details-row">
      <div class="det">
        <div class="det-lbl">Service Address</div>
        <div class="det-val">${[g('Street Address')+(apt?` Apt ${apt}`:''),`${g('City')}, ${g('State')} ${g('Zip')}`].filter(Boolean).join('<br>')||'—'}</div>
      </div>
      <div class="det">
        <div class="det-lbl">Contact</div>
        <div class="det-val">${[g('Phone')?`📞 ${g('Phone')}`:'',g('Email')?`✉ ${g('Email')}`:''].filter(Boolean).join('<br>')||'—'}</div>
      </div>
      <div class="det">

      </div>
    </div>

    ${olHTML ? `<div class="ol-wrap" style="display:block">
      <div class="ol-hdr">📋 Per-Line Details</div>
      <div class="ol-body">${olHTML}</div>
    </div>` : ''}
  `;
}

function renderOLLines(idxs) {
  const dtrColor = s => {
    const u=(s||'').toUpperCase();
    if(u.includes('POST')) return 'var(--green)';
    if(u.includes('SHIP')||u.includes('DELIV')) return 'var(--accent)';
    if(u.includes('CANCEL')||u.includes('DISC')) return 'var(--red)';
    if(u.includes('PORT')||u.includes('PEND')||u.includes('BYOD')) return 'var(--amber)';
    return 'var(--text3)';
  };
  const pIcon = p => { const u=(p||'').toUpperCase(); if(u.includes('AIR')||u.includes('INTERNET'))return'🌐'; if(u.includes('TABLET'))return'📱'; if(u.includes('WEAR'))return'⌚'; if(u.includes('VIDEO'))return'📺'; return'📱'; };

  return idxs.map(i => {
    const r   = reportData.ol[i];
    const g2  = k => String(r[k]??'').trim();
    const dtr = g2('DTR Status (enriched)');
    const dev = g2('spe.Phone');
    const tn  = g2('spe.TN');
    const tnT = g2('spe.TN Type');
    const pkg = g2('Package');
    const wt  = g2('Updated Wireless Type');
    const pc  = g2('spe.Port Carrier');
    const abp = g2('Auto Bill Pay');
    const ins = g2('spe.Install Date');
    const pt  = g2('Product Type (Broken Out)');
    const ot  = g2('spe.dtr Order Type');
    const tnFmt = tn.length===10?`(${tn.slice(0,3)}) ${tn.slice(3,6)}-${tn.slice(6)}`:tn;
    const col = dtrColor(dtr);
    const fields = [[tnFmt,'Line #'],[tnT,'Type'],[wt&&wt!=='Unknown'?wt:'','Device Type'],[pkg,'Plan'],[ot,'Order Type'],[pc,'Port From'],[ins,'Install'],[abp,'ABP']].filter(([v])=>v);
    return `<div class="ol-line">
      <div class="ol-top">
        <span style="font-size:15px">${pIcon(pt)}</span>
        <span class="ol-dev">${dev||pt||'—'}</span>
        <span class="ol-badge" style="color:${col};background:${col}18;border:1px solid ${col}30">${dtr||'—'}</span>
      </div>
      <div class="ol-fields">
        ${fields.map(([v,l])=>`<div class="olf"><div class="olf-l">${l}</div><div class="olf-v" style="${l==='Port From'?'color:var(--amber)':l==='ABP'?`color:${v==='Y'?'var(--green)':'var(--red)'}`:''}"">${v}</div></div>`).join('')}
      </div>
    </div>`;
  }).join('');
}

function spill(val) {
  if(!val) return '<span class="spill so">—</span>';
  const u=val.toUpperCase();
  let c='so';
  if(u.includes('ACTIVE'))c='sa';
  else if(u.includes('SHIP')||u.includes('DELIV'))c='ss';
  else if(u.includes('CANCEL'))c='sc';
  else if(u.includes('PEND')||u.includes('PORT')||u.includes('RESOLUT'))c='sp';
  return `<span class="spill ${c}">${val}</span>`;
}

  } else {
    document.getElementById('sessionPill').querySelector('span').textContent = 'Not configured';

  }
});
